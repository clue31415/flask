<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>증상 검색</title>

    <style>
        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        .container {
            margin-top: 80px;
            width: 600px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            width: 70%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 16px;
        }

        button.search-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #4a90e2;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button.search-btn:hover {
            background: #357bd8;
        }

        #result {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .symptom-card {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .symptom-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        .score {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            background: #eef4ff;
            color: #2a5bd7;
        }

        .high {
            border-left: 5px solid #ff4d4f;
        }

        .mid {
            border-left: 5px solid #ffa940;
        }

        .low {
            border-left: 5px solid #52c41a;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>증상 검색</h2>

    <div class="search-box">
        <input type="text" id="inputText" placeholder="증상을 입력하세요">
        <button class="search-btn" onclick="searchSymptom()">검색</button>
    </div>

    <div id="result"></div>

</div>

<script>
async function searchSymptom() {

    const text = document.getElementById("inputText").value;

    const response = await fetch("/symptom", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
    });

    const data = await response.json();

    // 점수 기준 정렬 (안전장치)
    data.symptoms.sort((a, b) => b.점수 - a.점수);

    let html = "";

    data.symptoms.forEach(item => {

        let levelClass = "low";

        if (item.점수 >= 80) levelClass = "high";
        else if (item.점수 >= 50) levelClass = "mid";

        html += `
            <div class="symptom-card ${levelClass}"
                 onclick="goDrug('${item.의심증상}')">
                <div>${item.의심증상}</div>
                <div class="score">${item.점수}점</div>
            </div>
        `;
    });

    document.getElementById("result").innerHTML = html;
}

function goDrug(symptom) {
    location.href = "/drug?symptom=" + encodeURIComponent(symptom);
}
</script>

</body>
</html>
